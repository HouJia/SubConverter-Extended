; =============================================================================
; 分流策略与规则配置（INI 真值源）
; =============================================================================
; 本文件为 subconverter/Sub-Store 兼容的 INI 格式配置
; 设计原则：
;   - 底座组（底座 · 🎚️ 手动切换、底座 · ♻️ 自动最优）提供出口选择
;   - 底座 · 🔌 国内直连作为统一直连出口，所有业务组均可切换至该组
;   - 业务组按场景划分（AI、游戏、影音、开发等），便于按需切换策略
;   - 系统组（广告拦截、遥测净化、漏网之鱼）处理特殊流量
; =============================================================================

[custom]
; =============================================================================
; 策略组定义（Proxy Groups）
; 格式：custom_proxy_group=名称`类型`节点匹配`选项1`选项2`...
;   - select: 手动选择，选项用 [] 包裹表示引用其他组
;   - url-test: 自动测速，格式为 url-test`匹配`测速URL`间隔`容差
; =============================================================================

; ------------------- 底座策略组 -------------------
; 底座 · ♻️ 自动最优：url-test 测速，自动选择延迟最低的节点
custom_proxy_group=底座 · ♻️ 自动最优`url-test`.*`http://www.gstatic.com/generate_204`300,,50

; 底座 · 🔌 国内直连：国内流量统一出口
custom_proxy_group=底座 · 🔌 国内直连`select`.*`[]DIRECT`[]底座 · ♻️ 自动最优

; 底座 · 🎚️ 手动切换：手动选择出口，包含所有地区节点
custom_proxy_group=底座 · 🎚️ 手动切换`select`.*`[]底座 · ♻️ 自动最优`[]地区 · 🇺🇸 美国节点`[]地区 · 🇭🇰 香港节点`[]地区 · 🌺 台湾节点`[]地区 · 🇸🇬 新加坡节点`[]地区 · 🇯🇵 日本节点`[]地区 · 🌍 其它国家`[]底座 · 🔌 国内直连

; 系统 · 🐟 漏网之鱼：MATCH 兜底（声明紧接底座组，顺序：自动最优 → 国内直连 → 手动切换 → 本组）
custom_proxy_group=系统 · 🐟 漏网之鱼`select`.*`[]底座 · ♻️ 自动最优`[]底座 · 🔌 国内直连`[]底座 · 🎚️ 手动切换`[]地区 · 🇺🇸 美国节点`[]地区 · 🇭🇰 香港节点`[]地区 · 🌺 台湾节点`[]地区 · 🇸🇬 新加坡节点`[]地区 · 🇯🇵 日本节点`[]地区 · 🌍 其它国家

