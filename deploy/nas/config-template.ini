; ------------------- 国家/地区节点分组 -------------------
; 基于节点名称关键字筛选，url-test 自动测速选择延迟最优节点
; 排除「海外用户专用」节点（避免将海外回国节点误判到地区分组）
custom_proxy_group=地区 · 🇺🇸 美国节点`url-test`(美国|US|USA|United States)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=地区 · 🇭🇰 香港节点`url-test`(香港|HK|Hong Kong)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=地区 · 🌺 台湾节点`url-test`(台湾|TW|Taiwan)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=地区 · 🇸🇬 新加坡节点`url-test`(新加坡|SG|Singapore)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=地区 · 🇯🇵 日本节点`url-test`(日本|JP|Japan)`http://www.gstatic.com/generate_204`300,,50
; 其它国家：排除已定义的地区节点（韩国节点已合并到其它国家）
custom_proxy_group=地区 · 🌍 其它国家`url-test`^(?!.*(?:海外用户专用|美国|US|USA|United States|香港|HK|Hong Kong|日本|JP|Japan|新加坡|SG|Singapore|台湾|TW|Taiwan)).*$`http://www.gstatic.com/generate_204`300,,50

; =============================================================================
; 规则集开关
; =============================================================================
enable_rule_generator=true
overwrite_original_rules=true

; =============================================================================
; 外部规则集（Rule Providers）
; 格式：ruleset=策略组名,规则URL 或 ruleset=策略组名,[]本地规则类型,内容
; =============================================================================

; 广告拦截 - Loyalsoldier 规则集
ruleset=系统 · 🚫 广告拦截,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt

; 本地规则片段注入锚点（由 compose-ini.sh 从 rulesets/*.ini 注入）
; >>> RULESET_INJECTION_START
; === 规则片段注入（由 compose-ini.sh 自动组装）===
; 片段源：derive/parts/rulesets/*.ini

; ================== 00-私有/局域网规则（基础直连） ==================
; 策略组: DIRECT
; 说明: 私有地址段与局域网流量固定直连

ruleset=DIRECT,[]GEOSITE,private
ruleset=DIRECT,[]GEOIP,private,no-resolve

; ================== 10-广告拦截与遥测净化规则 ==================
