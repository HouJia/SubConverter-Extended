; 说明: 前置拦截广告与追踪域
; 与 GEOSITE,category-ads-all 互补

ruleset=系统 · 🚫 广告拦截,[]GEOSITE,category-ads-all
ruleset=系统 · 🍃 应用遥测净化,[]GEOSITE,tracker

